<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f4" />
  <title>CHIHARABBIT</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f4f4f4;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f4f4}
    video,img{width:100%;height:100%;object-fit:contain;display:block;background:#f4f4f4}
    #tapHint{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
    #tapHint.show{opacity:1}
  </style>
</head>
<body>
  <main id="stage"></main>
  <div id="tapHint">画面をタップすると寝息が聞こえます</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const hint = document.getElementById('tapHint');
  const params = new URLSearchParams(location.search);

  // ?reset=1 で次回から「寝る」に戻す
  if (params.get('reset') === '1') {
    localStorage.removeItem('chiharabbit_next');
  }

  // テスト用: ?mode=sleep / ?mode=stand で強制表示
  const forced = params.get('mode');
  let mode;
  if (forced === 'sleep' || forced === 'stand') {
    mode = forced;
  } else {
    mode = localStorage.getItem('chiharabbit_next') || 'sleep';
    localStorage.setItem('chiharabbit_next', mode === 'sleep' ? 'stand' : 'sleep');
  }

  if (mode === 'sleep') {
    const v = document.createElement('video');
    v.src = 'sleep.mp4';
    v.autoplay = true;
    v.playsInline = true;
    v.setAttribute('playsinline','');
    v.setAttribute('webkit-playsinline','');
    v.preload = 'auto';
    v.controls = false;
    v.loop = false;
    v.muted = false;
    v.volume = 1; // 動画ファイル側で寝息を十分小さく調整済み
    stage.appendChild(v);

    const tryPlay = async () => {
      try {
        v.muted = false;
        await v.play();
        hint.classList.remove('show');
      } catch (_) {
        // iPhone Safari が音声付き自動再生を止めた場合だけ案内
        try {
          v.muted = true;
          await v.play();
        } catch (_) {}
        hint.classList.add('show');
      }
    };

    tryPlay();

    const enableSound = async () => {
      try {
        v.muted = false;
        if (v.ended) v.currentTime = 0;
        await v.play();
        hint.classList.remove('show');
      } catch (_) {}
    };
    document.addEventListener('click', enableSound, {passive:true});
    document.addEventListener('touchend', enableSound, {passive:true});
  } else {
    const img = document.createElement('img');
    img.src = 'stand.jpg';
    img.alt = 'CHIHARABBIT';
    stage.appendChild(img);
  }
})();
</script>
</body>
</html>
